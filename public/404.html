<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Lagwal — Premium Gloves</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...),
      // which will cause the browser to render the correct page without reloading.
      var l = window.location;
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    </script>
  </head>
  <body>
    <script type="text/javascript">
      // If the page was not found, redirect to index.html with the path in the query string
      window.location.replace(
        window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + 
        '/?/' + window.location.pathname.split('/').filter(Boolean).join('/') + window.location.search + window.location.hash
      );
    </script>
  </body>
</html>
